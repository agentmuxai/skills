# Checks every computer-use skill on a pull request; on main, builds the
# catalog, signs its index with the catalog key and publishes it with GitHub
# Pages (https://agentmuxai.github.io/skills/index.json), where AgentMux reads it.
name: catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The checker's own tests
        run: node --test scripts/lib.test.mjs
      - name: Check every skill
        run: node scripts/build.mjs --out dist --base-ref "origin/${{ github.base_ref }}"

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (git commit -s)
        run: |
          bad=0
          for c in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            if ! git show -s --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $c has no Signed-off-by line: add it with git commit -s --amend (see CONTRIBUTING.md)"
              bad=1
            fi
          done
          exit $bad

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and sign the catalog
        env:
          CATALOG_SIGNING_SEED: ${{ secrets.CATALOG_SIGNING_SEED }}
        run: |
          test -n "$CATALOG_SIGNING_SEED" || { echo "::error::the CATALOG_SIGNING_SEED secret isn't set"; exit 1; }
          # The agentmux publisher signs its own skills here, with the catalog key. A skill that
          # already carries a skill.sig keeps it. The key lives on the runner only, never in the repo.
          umask 077
          key="$RUNNER_TEMP/catalog-key.json"
          printf '{"seed":"%s"}' "$CATALOG_SIGNING_SEED" > "$key"
          for d in skills/*/; do
            [ -f "${d}skill.sig" ] && continue
            [ "$(node -p "require('./${d}computer-use.json').publisher")" = agentmux ] || continue
            node scripts/skill-sign.mjs sign "$d" --key "$key"
          done
          rm -f "$key"
          node scripts/build.mjs --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
